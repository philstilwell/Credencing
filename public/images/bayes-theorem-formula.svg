<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Bayes theorem formula</title>
  <desc id="desc">P of H given E equals P of E given H times P of H, divided by P of E.</desc>
  <rect width="1200" height="340" fill="#ffffff"/>
  <g fill="#000000" font-family="'Times New Roman', Times, Georgia, serif" font-style="italic" font-weight="700">
    <text x="24" y="210" font-size="126">P(H|E) =</text>
    <text x="880" y="112" font-size="112" text-anchor="middle">P(E|H) P(H)</text>
    <line x1="550" y1="154" x2="1180" y2="154" stroke="#000000" stroke-width="7" stroke-linecap="square"/>
    <text x="880" y="304" font-size="112" text-anchor="middle">P(E)</text>
  </g>
</svg>
