<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Bayes theorem</title>
  <desc id="desc">Bayes theorem formula showing posterior equals likelihood times prior divided by evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b160d"/>
      <stop offset="0.48" stop-color="#4b2413"/>
      <stop offset="1" stop-color="#7a3b18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1400" height="760" rx="42" fill="url(#bg)"/>
  <rect x="58" y="58" width="1284" height="644" rx="34" fill="#130d09" opacity="0.58" stroke="#f0b35a" stroke-opacity="0.28"/>
  <g filter="url(#shadow)">
    <text x="700" y="145" text-anchor="middle" fill="#f8e2bd" font-family="Georgia, 'Times New Roman', serif" font-size="54">Bayes Theorem</text>
    <text x="700" y="242" text-anchor="middle" fill="#fff7ea" font-family="Georgia, 'Times New Roman', serif" font-size="74">
      P(H|E) =
    </text>
    <text x="722" y="226" fill="#fff7ea" font-family="Georgia, 'Times New Roman', serif" font-size="58">P(E|H) P(H)</text>
    <line x1="705" y1="253" x2="1070" y2="253" stroke="#fff7ea" stroke-width="5" stroke-linecap="round"/>
    <text x="770" y="325" fill="#fff7ea" font-family="Georgia, 'Times New Roman', serif" font-size="58">P(E)</text>
  </g>
  <g fill="#f8e2bd" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="30">
    <text x="132" y="430">Posterior</text>
    <text x="132" y="468" fill="#c9ad86" font-size="23">P(H|E): confidence in the hypothesis after the evidence</text>
    <text x="132" y="530">Likelihood</text>
    <text x="132" y="568" fill="#c9ad86" font-size="23">P(E|H): how expected the evidence is if the hypothesis is true</text>
    <text x="748" y="430">Prior</text>
    <text x="748" y="468" fill="#c9ad86" font-size="23">P(H): confidence before the new evidence</text>
    <text x="748" y="530">Evidence Term</text>
    <text x="748" y="568" fill="#c9ad86" font-size="23">P(E): how expected the evidence is overall</text>
  </g>
  <text x="700" y="652" text-anchor="middle" fill="#f0b35a" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="25">
    Updated confidence = diagnostic strength of the evidence x starting confidence, normalized by alternatives
  </text>
</svg>
