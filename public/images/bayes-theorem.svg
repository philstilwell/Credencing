<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="288" viewBox="0 0 1024 288" role="img" aria-labelledby="title desc">
  <title id="title">Bayes theorem formula</title>
  <desc id="desc">P of H given E equals P of E given H times P of H, divided by P of E.</desc>
  <rect width="1024" height="288" fill="#ffffff"/>
  <g fill="#000000" font-family="Times New Roman, Times, Georgia, serif" font-style="italic" font-weight="700">
    <text x="24" y="185" font-size="110">P(H|E) =</text>
    <text x="738" y="101" font-size="94" text-anchor="middle">P(E|H) P(H)</text>
    <line x1="474" y1="144" x2="1010" y2="144" stroke="#000000" stroke-width="8" stroke-linecap="square"/>
    <text x="738" y="258" font-size="94" text-anchor="middle">P(E)</text>
  </g>
</svg>
